<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_5 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Create "Document" particles
const docGeometry = new THREE.PlaneGeometry(0.5, 0.7);
const docs = [];
const docCount = 20;

for (let i = 0; i < docCount; i++) {
    const material = new THREE.MeshBasicMaterial({ 
        color: 0x00B386, 
        transparent: true, 
        opacity: 0.3,
        side: THREE.DoubleSide
    });
    const doc = new THREE.Mesh(docGeometry, material);
    
    doc.position.set(
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 5 - 5
    );
    doc.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
    
    scene.add(doc);
    docs.push({
        mesh: doc,
        speed: 0.01 + Math.random() * 0.02,
        rotSpeed: 0.005 + Math.random() * 0.01
    });
}

// Search "Lens" / Grid
const gridHelper = new THREE.GridHelper(20, 20, 0x00B386, 0x2563EB);
gridHelper.rotation.x = Math.PI / 2;
gridHelper.position.z = -8;
gridHelper.material.opacity = 0.1;
gridHelper.material.transparent = true;
scene.add(gridHelper);

camera.position.z = 5;

function animate() {
    requestAnimationFrame(animate);
    
    docs.forEach(d => {
        d.mesh.position.z += d.speed;
        d.mesh.rotation.x += d.rotSpeed;
        d.mesh.rotation.y += d.rotSpeed;
        
        if (d.mesh.position.z > 5) {
            d.mesh.position.z = -10;
            d.mesh.position.x = (Math.random() - 0.5) * 10;
            d.mesh.position.y = (Math.random() - 0.5) * 10;
        }
    });

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_5 -->
</body>
</html>
