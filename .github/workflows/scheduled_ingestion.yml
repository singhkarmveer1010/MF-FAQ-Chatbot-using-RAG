name: Automated Ingestion Scheduler (Phase 7)

on:
  # Automated cron schedule: Run daily at 05:00 UTC (10:30 AM IST)
  schedule:
    - cron: '0 5 * * *'
  
  # Allow manual trigger from GitHub Actions UI tab
  workflow_dispatch:
    inputs:
      trigger_api_webhook:
        description: 'Send webhook to live server API instead of local execution'
        required: false
        default: 'false'

jobs:
  scheduled-ingestion:
    name: Run Mutual Fund Data Ingestion
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    
    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Option A — Trigger Live API Endpoint (If configured)
        if: ${{ env.API_BASE_URL != '' && (github.event.inputs.trigger_api_webhook == 'true' || github.event_name == 'schedule') }}
        env:
          INGEST_ADMIN_TOKEN: ${{ secrets.INGEST_ADMIN_TOKEN }}
        run: |
          echo "📡 Sending ingestion trigger request to live API: $API_BASE_URL/api/ingest"
          curl -X POST "$API_BASE_URL/api/ingest?background=true" \
            -H "Authorization: Bearer $INGEST_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error || echo "⚠️ API trigger returned non-200 or not configured. Proceeding to local pipeline execution."

      - name: ⚙️ Option B — Execute Local Ingestion Pipeline & Update Vector Store
        if: ${{ env.API_BASE_URL == '' || (github.event_name != 'schedule' && github.event.inputs.trigger_api_webhook != 'true') }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy_key_for_offline_embedding_indexing' }}
          EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
          VECTOR_STORE_PATH: ./vectorstore
        run: |
          echo "🔄 Running offline data ingestion pipeline (Scrape -> Chunk -> Embed -> Index ChromaDB)..."
          python -m src.ingestion.ingest_pipeline

      - name: 📊 Upload Updated Vector Store Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromadb-vectorstore
          path: vectorstore/
          retention-days: 7
